<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#192a29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>世界動物尋蹤</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?screen=1">
  <script type="module" src="./main.js?screen=1"></script>
</head>
<body>
  <main id="game" aria-label="世界動物尋蹤">
    <div class="screen-area">
      <div class="screen">
        <canvas id="world" width="240" height="160" aria-label="遊戲畫面"></canvas>
        <canvas id="players" width="240" height="160" aria-hidden="true"></canvas>
        <div id="hardware" class="hardware" hidden>
          <div id="dpad" class="dpad" role="group" aria-label="方向鍵">
            <button type="button" class="north" data-dir="up" aria-label="向上"><i></i></button>
            <button type="button" class="west" data-dir="left" aria-label="向左"><i></i></button>
            <span aria-hidden="true" class="hub"><i></i></span>
            <button type="button" class="east" data-dir="right" aria-label="向右"><i></i></button>
            <button type="button" class="south" data-dir="down" aria-label="向下"><i></i></button>
          </div>
          <div class="action-keys" role="group" aria-label="操作鍵">
            <button type="button" class="game-key b-key" id="b-button" data-key="B" aria-label="B">B</button>
            <button type="button" class="game-key a-key" id="a-button" data-key="A" aria-label="A">A</button>
            <button type="button" class="menu-key" id="menu" aria-expanded="false">選單</button>
          </div>
          <button type="button" class="web-tools" id="web-tools" aria-haspopup="dialog" aria-controls="dialogue" hidden>同學連線與檔案</button>
        </div>
      </div>
    </div>

    <section id="setup" class="setup" aria-labelledby="game-title">
      <div class="load-panel">
        <div class="cart-icon" aria-hidden="true"><i></i></div>
        <h1 id="game-title">世界動物尋蹤</h1>
        <p>請選擇 <bdi>Emerald-Safari.gba</bdi> 或英文原版《綠寶石》的 <bdi>.gba</bdi> 遊戲檔。</p>
        <button id="choose-rom" class="insert" type="button">選擇遊戲檔</button>
        <p id="load-status" role="status" hidden></p>
      </div>
    </section>
    <input id="rom-file" type="file" accept=".gba,application/octet-stream" hidden>
    <input id="save-file" type="file" accept=".sav,application/octet-stream" hidden>

    <div id="toast" class="toast" role="status" hidden></div>

    <section id="dialogue" class="dialogue" role="dialog" aria-labelledby="speaker" hidden>
      <div class="dialogue-paper">
        <h2 id="speaker"></h2>
        <p id="message"></p>
        <form id="profile-form" class="profile-form" hidden>
          <label>班別<input id="student-class" type="text" maxlength="8" required autocomplete="off" autocorrect="off" enterkeyhint="next"></label>
          <label>姓名<input id="student-name" type="text" maxlength="12" required autocomplete="off" autocorrect="off" enterkeyhint="done"></label>
        </form>
        <div id="invite-link" class="invite-link" hidden>
          <label for="room-url">同學邀請連結</label>
          <input id="room-url" type="url" readonly autocapitalize="off" spellcheck="false">
        </div>
        <div id="choices" class="choices"></div>
      </div>
    </section>
    <noscript><p>請在瀏覽器啟用 JavaScript 來開始考察。</p></noscript>
  </main>
</body>
</html>
